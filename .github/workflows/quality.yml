name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --all-groups --frozen
      - name: Run Ruff
        run: uv run ruff check src tests
      - name: Run mypy
        run: uv run mypy src tests
      - name: Run pytest
        run: uv run pytest

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run frontend lint
        run: npm run lint
      - name: Run frontend type check
        run: npm run typecheck
      - name: Run frontend component tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  openspec-quality:
    name: OpenSpec Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pinned OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.17.0
      - name: Validate all OpenSpec artifacts
        run: openspec validate --all --strict --no-interactive

  platform-contracts:
    name: Platform Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        working-directory: backend
    env:
      LCLAI_OPENAI_API_KEY: ""
      LCLAI_ARK_API_KEY: ""
      LCLAI_OPENAI_MODEL_ID: ""
      LCLAI_ARK_MODEL_ID: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --all-groups --frozen
      - name: Run credential-free core contracts
        run: >-
          uv run pytest
          tests/test_config.py
          tests/test_storage.py
          tests/test_health_api.py
          tests/test_model_gateway.py
          tests/test_app_integration.py
