[project]
name = "lclai-backend"
version = "0.1.0"
description = "lclAI 本地量化工作台后端"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.121,<1.0",
  "pydantic-settings>=2.11,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.38,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.18,<2.0",
  "pytest>=8.4,<10.0",
  "pytest-cov>=7.0,<8.0",
  "ruff>=0.14,<1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lclai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = [
  "ignore:Using .* with .* is deprecated",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
